<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Daymark">
  <defs>
    <linearGradient id="dm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4603A"/>
      <stop offset="100%" stop-color="#B04320"/>
    </linearGradient>
  </defs>
  <!-- Tactile rounded stationery stamp tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#dm-bg)"/>
  <!-- Subtle inner letterpress frame -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="11.5" fill="none" stroke="#F6F2EA" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- Rising sun horizon arc (rhythm / daily mark) -->
  <path d="M16 44 H48" stroke="#F6F2EA" stroke-opacity="0.4" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M21.5 44 A10.5 10.5 0 0 1 42.5 44" fill="#F6F2EA" fill-opacity="0.16"/>
  <!-- Confident ink checkmark stamp -->
  <path d="M20.5 31.5 L28.8 39.5 L44.5 22.5" fill="none" stroke="#FAF7F0" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
